[US500]
bybit_symbol = "SP500"                   # Bybit fee example uses "SP500"; confirm in app
asset_class = "INDEX"
profit_currency = "USD"
commission_per_lot = 3.0                 # src: bybit_fees ("Other Contracts" $3/lot; example: SP500 0.20 lot x 3 USDx)
swap_type = "MONEY"                      # src: bybit_fees (Indices charged by money)
provider_symbols = { OANDA = "SPX500_USD" }
